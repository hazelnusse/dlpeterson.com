<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="{{ get_url(path='favicon.svg') }}"
      type="image/svg+xml"
    />
    <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="{{ get_url(path='apple-touch-icon.png') }}"
    />
    <title>{{ page.title }} | {{ config.title }}</title>
    <meta name="description" content="{{ config.description }}" />
    <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ get_url(path='css/print.css') }}"
      media="print"
    />
    {% if current_url %}
      <link rel="canonical" href="{{ current_url }}" />
    {% endif %}
  </head>
  <body class="resume">
    <p class="resume-back wrap">
      <a href="{{ get_url(path='@/_index.md') }}">← {{ config.title }}</a>
    </p>
    <main class="wrap resume-doc">{{ page.content | safe }}</main>
  </body>
</html>
