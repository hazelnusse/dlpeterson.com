{% extends "base.html" %}
{% block title %}Tag: {{ term.name }} | {{ config.title }}{% endblock title %}
{% block content %}
  <h1>Tag: {{ term.name }}</h1>
  <div class="post-list">
    {% for page in term.pages %}
      <article>
        <h2><a href="{{ page.permalink }}">{{ page.title }}</a></h2>
        <p class="post-meta">{{ page.date | date(format="%B %-d, %Y") }}</p>
      </article>
    {% endfor %}
  </div>
{% endblock content %}
